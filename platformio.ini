[platformio]
src_dir = esp32_marauder
test_dir = test

[env:native]
platform = native@1.2.1
test_framework = unity
test_build_src = true
extra_scripts =
  pre:tools/native_coverage.py
build_src_filter =
  -<*>
  +<MarauderMacAddress.cpp>
  +<PcapHeader.cpp>
  +<Switches.cpp>
  +<DisplayLine.cpp>
  +<BeaconFrame.cpp>
  +<WdgResponse.cpp>
  +<FoxHuntTarget.cpp>
  +<TargetListSort.cpp>
  +<TDongleStats.cpp>
  +<IPv4Range.cpp>
  +<FirmwareMetadata.cpp>
  +<MenuMarquee.cpp>
  +<GpsTrackerStats.cpp>
  +<BootSplash.cpp>
  +<MenuInputRepeat.cpp>
  +<TDongleBus.cpp>
  +<RemoteIdModel.cpp>
  +<RemoteIdDecoder.cpp>
  +<MemoryGuard.cpp>
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -Wpedantic
  --coverage
  -Itest/support

[env:waveshare-esp32-s3-touch-lcd-349]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_size = 16MB
board_build.partitions = min_spiffs.csv
board_build.arduino.memory_type = qio_opi
board_build.arduino.usb_mode = cdc
monitor_speed = 115200
monitor_filters = direct

build_flags =
  -DMARAUDER_WS349
  -DHAS_PSRAM
  -DHAS_NIMBLE_2
  -DHAS_IDF_3
  -DHAS_DUAL_BAND
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_RUNNING_CORE=1
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -Wno-deprecated-declarations
  -Wno-unused-variable
  -Wno-unused-function
  -Wno-unused-parameter
  -Wno-sign-compare
  -Wno-narrowing
  -Wno-return-type
  -std=gnu++17
  -Os
  -fno-rtti
  -fno-exceptions
  -fno-threadsafe-statics
  -ffunction-sections
  -fdata-sections
  -flto

build_unflags =
  -Werror

lib_deps =
  https://github.com/adafruit/Adafruit_GFX_Library/archive/refs/tags/1.12.6.zip
  https://github.com/adafruit/Adafruit_BusIO/archive/refs/tags/1.17.4.zip
  https://github.com/adafruit/Adafruit_NeoPixel/archive/refs/tags/1.15.5.zip
  https://github.com/jrowberg/i2cdevlib/archive/refs/tags/Arduino_2.0.zip
  https://github.com/mathertel/OneButton/archive/refs/tags/v2.0.1.zip
  https://github.com/esp8266/Arduino/archive/refs/tags/3.0.2.zip
  https://github.com/knolleary/pubsubclient/archive/refs/tags/2.8.zip
  https://github.com/moononournation/Arduino_GFX/archive/refs/tags/1.4.0.zip
  https://github.com/m5stack/M5GFX/archive/refs/tags/v0.0.16.zip
  https://github.com/espressif/arduino-esp32/archive/refs/tags/3.0.7.zip#variants

lib_ignore =
  TFT_eSPI

build_src_filter =
  -<*>
  +<esp32_marauder/>

board_build.arduino.lto = true
board_build.arduino.partitions = min_spiffs.csv

[env:waveshare-esp32-s3-touch-lcd-349-ota]
extends = waveshare-esp32-s3-touch-lcd-349
build_flags = ${env:waveshare-esp32-s3-touch-lcd-349.build_flags}
  -DOTA_SIZE=8388608